<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code block comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #090d14;
        color: #e8f1fb;
        font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding: 20px;
      }
      .panel { min-width: 0; }
      .label {
        padding-bottom: 10px;
        color: #a8c4dc;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .frame {
        overflow: hidden;
        border: 1px solid #25384a;
        border-radius: 14px;
        background: #0d1119;
      }
      .frame img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main class="grid">
      <section class="panel">
        <div class="label">Reference</div>
        <div class="frame"><img src="code-block-reference.png?v=final" alt="Reference code block" /></div>
      </section>
      <section class="panel">
        <div class="label">Implementation</div>
        <div class="frame"><img src="code-block-copy-stable.png?v=final" alt="Implemented code block" /></div>
      </section>
    </main>
  </body>
</html>
